<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#059669">
  <title>Offline • Kos Digital</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 10%, #064e3b 0, #0f172a 45%, #020617 100%);
      color: #e2e8f0;
    }
    .card {
      width: 100%;
      max-width: 430px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(14px);
      padding: 32px;
      text-align: center;
      box-shadow: 0 30px 80px -30px rgba(0,0,0,.8);
    }
    .logo {
      width: 64px; height: 64px; margin: 0 auto; border-radius: 20px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #34d399, #0f766e);
      box-shadow: 0 18px 40px -16px rgba(16,185,129,.7);
    }
    h1 { margin: 22px 0 8px; font-size: 22px; letter-spacing: -.02em; color: #fff; }
    p { margin: 0; font-size: 13px; line-height: 1.7; color: #94a3b8; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 20px;
      padding: 7px 12px; border-radius: 999px; font-size: 10px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase; color: #fbbf24;
      background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.2);
    }
    .dot { width: 7px; height: 7px; border-radius: 999px; background: #fbbf24; }
    a {
      display: inline-flex; justify-content: center; align-items: center; gap: 8px;
      margin-top: 24px; width: 100%; padding: 13px 18px; border-radius: 14px;
      background: #059669; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700;
      transition: background .2s ease;
    }
    a:hover { background: #047857; }
    .hint { margin-top: 16px; font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
        <path d="M3.5 10.4 12 3.5l8.5 6.9" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5.5 9.4v9.1c0 .6.5 1.1 1.1 1.1h3.2v-4.3c0-.7.6-1.3 1.3-1.3h1.8c.7 0 1.3.6 1.3 1.3v4.3h3.2c.6 0 1.1-.5 1.1-1.1V9.4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Anda sedang offline</h1>
    <p>Koneksi internet tidak tersedia. Halaman yang membutuhkan data terbaru tidak dapat dimuat saat ini.</p>
    <span class="badge"><span class="dot"></span> Mode Offline</span>
    <a href="/">Coba Muat Ulang</a>
    <p class="hint">Halaman publik yang pernah dibuka tetap tersedia melalui cache PWA.</p>
  </main>
</body>
</html>
